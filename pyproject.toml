[project]
name="codeguard"
version="0.1.0"
requires-python=">=3.11"
dependencies= [
    "fastapi>=0.110.3",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2.0",
    "PyJWT[crypto]>=2.8",
    "openrouter>=0.9.2",
]

[project.optional-dependencies]
dev=["pytest>=8.0","httpx>=0.27"]

[tool.pytest.ini_option]
pythonpath=["."]
